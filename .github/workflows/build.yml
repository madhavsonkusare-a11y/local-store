name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    # Stacked PRs need checks before their base branch reaches main too.

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # First-party catalog provenance uses the commit that last changed
          # each definition; a shallow checkout reports the merge commit.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/requirements-catalog.txt
      - name: Validate offline catalog, artwork and identity
        run: |
          python scripts/test_catalog.py
          python scripts/test_recipe_platforms.py
          python scripts/test_validate_recipes.py
          python scripts/test_template_platforms.py
          python scripts/check-recipe-platforms.py
          python scripts/check-template-platforms.py
          python scripts/test_release.py
          python scripts/test_engine_payload.py
          python -m unittest discover -s tests -p test_v1_qualified.py
          python scripts/check-v1-qualified.py
          python scripts/build-engine-payload.py
          python scripts/catalog_pipeline.py --check
          python scripts/cache-catalog-icons.py --check
          node scripts/generate-brand.mjs --check
      - run: npx playwright install chromium
      # `rust-version` is a promise Cargo never checks against the dependency
      # graph, so a stale value passes every test on a newer toolchain. This
      # compares it to what the graph needs; the MSRV job below then proves our
      # own code builds there, which the comparison alone cannot.
      - name: Check the declared minimum Rust version
        run: python scripts/check-msrv.py
      # A dependency whose licence cannot be satisfied permissively changes what
      # may be shipped, and nothing else in the build would notice.
      - name: Check dependency licences
        run: |
          python scripts/check-licenses.py --self-test
          python scripts/check-licenses.py
      # A known vulnerability in the graph is the one class of problem that
      # arrives without anybody changing this repository, so it is checked on
      # every run rather than at release time. Accepted findings need a
      # recorded reason; the gate refuses to pass on an absent tool or an
      # unfetched database, because a scan that checked nothing reads like
      # evidence that it did.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Check dependency advisories
        run: python scripts/check-advisories.py --refresh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --locked
      - name: Validate reviewed Compose recipes
        run: python scripts/validate-recipes.py
      # Interaction and axe checks are cross-platform. Pixel baselines are
      # reviewed and updated on Windows, where the primary WebView ships.
      - run: npm test -- --ignore-snapshots
      - name: Upload UI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ui-failure-diagnostics
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Builds on the exact version the manifest promises, bypassing
  # rust-toolchain.toml, so the claim is tested rather than asserted.
  minimum-rust:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Read the declared minimum from Cargo.toml
        id: msrv
        shell: pwsh
        run: |
          $match = Select-String -Path Cargo.toml -Pattern '^rust-version\s*=\s*"([^"]+)"'
          if (-not $match) { throw 'Cargo.toml has no rust-version' }
          "version=$($match.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: swatinem/rust-cache@v2
      - env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: cargo check --locked --all-targets

  build:
    needs: [quality, minimum-rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      # These cover Windows CLI stdout/exit codes and job-object termination
      # behind the bounded process runner.
      - name: Test CLI and bounded process execution
        run: |
          cargo test --locked --target ${{ matrix.target }} --test cli_queries
          cargo test --locked --target ${{ matrix.target }} --test process_runner

      # The shipped Windows binary is a GUI-subsystem image and behaves
      # differently from the console binary every debug test uses.
      - name: Test the packaged CLI
        run: cargo test --locked --release --target ${{ matrix.target }} --test cli_packaged

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "=2.11.4" --locked

      - name: Build (release)
        run: cargo tauri build --target ${{ matrix.target }} --ci

      - name: Stage release payloads and checksums
        run: python scripts/prepare-release.py --target ${{ matrix.target }} --build-dir target/${{ matrix.target }}/release --output-dir dist/${{ matrix.target }}

      # Upload staged installers, the target-named CLI and integrity metadata.
      # Bundle internals, debug symbols and Cargo dependency files stay out.
      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: local-store-${{ matrix.target }}
          path: dist/${{ matrix.target }}/*
          if-no-files-found: error

  # This job does not build or certify another platform. Its Linux runner only
  # attests and publishes the Windows artifact.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Provenance is signed by the workflow's own OIDC identity. `id-token`
      # is what lets it prove which workflow, at which commit, produced these
      # files; `attestations` is what lets it publish that proof.
      id-token: write
      attestations: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: local-store-*

      # Says where each artifact came from, verifiable with
      # `gh attestation verify <file> --repo <owner>/<repo>`. This is build
      # provenance, not a code-signing signature and not an updater signature:
      # it tells you this workflow built the file, not that an identified
      # publisher vouches for it. Task 30 remains outstanding.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: artifacts/local-store-*/*

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/local-store-*/*
          fail_on_unmatched_files: true
